services:
    db:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ellepass}
            POSTGRES_DB: ${POSTGRES_DB:-postgres}
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - elli_db:/var/lib/postgresql/data
        networks:
            - elli_network

networks:
    elli_network:
        driver: bridge

volumes:
    elli_db:
