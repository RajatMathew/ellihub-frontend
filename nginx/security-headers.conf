# Response headers every route serves, included from each `location` in
# nginx.conf.
#
# Included per location rather than set once on the `server` block because of
# how `add_header` inherits: a level that declares any `add_header` of its own
# discards every one inherited from above. All six locations set Cache-Control,
# so server-level security headers would have been dropped by all six — present
# in the config, absent from every response.
#
# `always` so they are sent on error responses too, not only 2xx/3xx.

# Believe the Content-Type we send. Without it a response can be re-read as a
# type the bytes merely resemble.
add_header X-Content-Type-Options "nosniff" always;

# Nothing embeds this application. The mail reading pane frames *content*,
# which is unaffected — this is about the app itself being framed.
add_header X-Frame-Options "DENY" always;

# Send the full URL only to ourselves; cross-origin requests see the origin,
# and an http destination sees nothing.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Features this application does not use, denied outright. `display-capture` is
# deliberately absent: the assistant's prompt input calls `getDisplayMedia`,
# and leaving it unlisted keeps its default of same-origin-allowed.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;

# Browsers ignore this over plain http, so it is inert if anything reaches this
# container directly. It belongs at the TLS terminator as well; set here so the
# guarantee does not depend on that being configured.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
