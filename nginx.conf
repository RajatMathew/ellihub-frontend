server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Compression. Without it this deployment served the 630 kB JS entry and the
  # 536 kB stylesheet uncompressed; both are around a quarter of that gzipped.
  # Pre-built assets are hashed and immutable, so the cost is paid once per
  # file per edge rather than per request.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Security headers are included in every location, not set once here: a
  # location that declares its own `add_header` — and all of these set
  # Cache-Control — discards everything inherited from the server block.
  # See nginx/security-headers.conf.

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /workbox- {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
