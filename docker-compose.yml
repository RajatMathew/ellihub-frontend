services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ellepass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - elli_db:/var/lib/postgresql/data
    networks:
      - elli_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./elli-core
      dockerfile: docker/prod.Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ellepass}@db:5432/${POSTGRES_DB:-postgres}?schema=public
        BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-https://york.zubble.co}
        CLIENT_URL: ${CLIENT_URL:-https://york.zubble.co}
        NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ellepass}@db:5432/${POSTGRES_DB:-postgres}?schema=public
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-https://york.zubble.co}
      CLIENT_URL: ${CLIENT_URL:-https://york.zubble.co}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      PDF_ENGINE_URL: ${PDF_ENGINE_URL:-http://pdf-engine:8000}
      PDF_ENGINE_API_KEY_HEADER: ${PDF_ENGINE_API_KEY_HEADER:-X-API-Key}
      PDF_ENGINE_API_KEYS: ${PDF_ENGINE_API_KEYS:-local-dev-key}
      PDF_ENGINE_API_KEY: ${PDF_ENGINE_API_KEY:-local-dev-key}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      FIELDWIRE_API_TOKEN: ${FIELDWIRE_API_TOKEN:-}
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_REDIRECT_URI: ${QUICKBOOKS_REDIRECT_URI:-https://york.zubble.co/api/v1/integrations/quickbooks/callback}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-sandbox}
      QUICKBOOKS_MINOR_VERSION: ${QUICKBOOKS_MINOR_VERSION:-75}
      QUICKBOOKS_TOKEN_ENCRYPTION_KEY: ${QUICKBOOKS_TOKEN_ENCRYPTION_KEY:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MAIL_ALLOWED_SENDERS: ${MAIL_ALLOWED_SENDERS:-}
      MAIL_ALLOW_CUSTOM_SENDER: ${MAIL_ALLOW_CUSTOM_SENDER:-true}
      MAIL_ASSET_DIR: ${MAIL_ASSET_DIR:-src/modules/mail/assets}
      MAIL_TEMPLATE_DIR: ${MAIL_TEMPLATE_DIR:-src/modules/mail/templates}
      SEED_API_KEY: ${SEED_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - elli_network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - elli_network

networks:
  elli_network:
    driver: bridge

volumes:
  elli_db:
