services:
  q-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ellepass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - elli_db:/var/lib/postgresql/data
    networks:
      - elli_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  q-api:
    build:
      context: ./elli-core
      dockerfile: docker/prod.Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ellepass}@q-db:5432/${POSTGRES_DB:-postgres}?schema=public}
        BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
        CLIENT_URL: ${CLIENT_URL:-http://localhost}
        NODE_ENV: ${NODE_ENV:-development}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ellepass}@q-db:5432/${POSTGRES_DB:-postgres}?schema=public}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      PDF_ENGINE_URL: ${PDF_ENGINE_URL:-http://q-pdf:8000}
      PDF_ENGINE_API_KEY_HEADER: ${PDF_ENGINE_API_KEY_HEADER:-X-API-Key}
      PDF_ENGINE_API_KEYS: ${PDF_ENGINE_API_KEYS:-local-dev-key}
      PDF_ENGINE_API_KEY: ${PDF_ENGINE_API_KEY:-local-dev-key}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      FIELDWIRE_API_TOKEN: ${FIELDWIRE_API_TOKEN:-}
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_REDIRECT_URI: ${QUICKBOOKS_REDIRECT_URI:-http://localhost/api/v1/integrations/quickbooks/callback}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-sandbox}
      QUICKBOOKS_MINOR_VERSION: ${QUICKBOOKS_MINOR_VERSION:-75}
      QUICKBOOKS_TOKEN_ENCRYPTION_KEY: ${QUICKBOOKS_TOKEN_ENCRYPTION_KEY:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      ALLOWED_SENDERS: ${ALLOWED_SENDERS:-}
      MAIL_ALLOWED_SENDERS: ${MAIL_ALLOWED_SENDERS:-}
      MAIL_ALLOW_CUSTOM_SENDER: ${MAIL_ALLOW_CUSTOM_SENDER:-true}
      MAIL_ASSET_DIR: ${MAIL_ASSET_DIR:-src/modules/mail/assets}
      MAIL_TEMPLATE_DIR: ${MAIL_TEMPLATE_DIR:-src/modules/mail/templates}
      SEED_API_KEY: ${SEED_API_KEY:-}
    depends_on:
      q-db:
        condition: service_healthy
      q-pdf:
        condition: service_healthy
    networks:
      - elli_network

  q-pdf:
    build:
      context: ./elli-engine
      dockerfile: docker/Dockerfile
      target: production
    container_name: pdf-engine
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - pdf-engine-storage:/app/storage
    environment:
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      PDF_ENGINE_STORAGE_DIR: ${PDF_ENGINE_STORAGE_DIR:-/app/storage}
      PDF_ENGINE_CACHE_DIR: ${PDF_ENGINE_CACHE_DIR:-/app/storage/cache}
      PDF_ENGINE_GENERATED_DIR: ${PDF_ENGINE_GENERATED_DIR:-/app/storage/generated}
      PDF_ENGINE_BATCH_DIR: ${PDF_ENGINE_BATCH_DIR:-/app/storage/batch}
      PDF_ENGINE_PREVIEWS_DIR: ${PDF_ENGINE_PREVIEWS_DIR:-/app/storage/previews}
      PDF_ENGINE_TEMP_DIR: ${PDF_ENGINE_TEMP_DIR:-/app/storage/temp}
      PDF_ENGINE_ALLOWED_HOSTS: ${PDF_ENGINE_ALLOWED_HOSTS:-*}
      PDF_ENGINE_CORS_ALLOW_ORIGINS: ${PDF_ENGINE_CORS_ALLOW_ORIGINS:-*}
      PDF_ENGINE_CORS_ALLOW_METHODS: ${PDF_ENGINE_CORS_ALLOW_METHODS:-*}
      PDF_ENGINE_CORS_ALLOW_HEADERS: ${PDF_ENGINE_CORS_ALLOW_HEADERS:-*}
      PDF_ENGINE_API_KEYS: ${PDF_ENGINE_API_KEYS:-local-dev-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - elli_network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - q-api
    networks:
      - elli_network

networks:
  elli_network:
    driver: bridge

volumes:
  elli_db:
  pdf-engine-storage:
