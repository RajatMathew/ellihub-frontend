# All configuration from environment (Dokploy-friendly).
# Copy .env.example to .env and set values, or set in Dokploy project/env vars.

services:
    db:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB:-postgres}
        ports:
            - '${POSTGRES_PORT:-45433}:5432'
        volumes:
            - elli_db:/var/lib/postgresql/data
        networks:
            - elli_network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
            interval: 1h
            timeout: 5s
            retries: 5
            start_period: 10s

    api:
        build:
            context: .
            dockerfile: docker/prod.Dockerfile
            args:
                DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/postgres}
                BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-}
                CLIENT_URL: ${CLIENT_URL:-}
                NODE_ENV: ${NODE_ENV:-production}
        env_file:
            - .env
        environment:
            DATABASE_URL: ${DATABASE_URL}
            BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
            CLIENT_URL: ${CLIENT_URL}
            NODE_ENV: ${NODE_ENV:-production}
            PORT: ${PORT:-3000}
            PDF_ENGINE_URL: ${PDF_ENGINE_URL:-http://pdf-engine:8000}
        # ports:
        #     - '${API_PORT:-3005}:3000'
        depends_on:
            db:
                condition: service_healthy
        networks:
            - elli_network

networks:
    elli_network:
        driver: bridge

volumes:
    elli_db:
